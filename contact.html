<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact | Teakwood</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Teakwood.</a>
            <nav>
                <ul>
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="shop.html" class="nav-link">Shop</a></li>
                    <li><a href="contact.html" class="nav-link active">Contact</a></li>
                </ul>
            </nav>
            <div class="cart-icon" style="margin-left:auto"><i class="fas fa-shopping-bag"></i><span class="cart-badge" id="cart-count">0</span></div>
        </div>
    </header>

    <div class="page-header">
        <h1>Contact Us</h1>
    </div>
    <div class="contact-wrapper">
        <div class="contact-info">
            <h3>Get in Touch</h3>
            <p>We’d love to hear from you. Whether you have a question about our furniture or shipping, our team is ready to answer.</p>
            <p style="margin-top:2rem;"><i class="fas fa-envelope"></i> hello@teakwoodshop.com</p>
            <p><i class="fas fa-phone"></i> +1 (555) 123-4567</p>
        </div>
        <form class="contact-form" id="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea rows="6" placeholder="Your Message" required></textarea>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
