<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teakwood | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">Teakwood.</a>
            <nav>
                <ul>
                    <li><a href="index.html" class="nav-link active">Home</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                    <li><a href="shop.html" class="nav-link">Shop</a></li>
                    <li><a href="contact.html" class="nav-link">Contact</a></li>
                </ul>
            </nav>
            <div class="header-icons">
                <div class="cart-icon">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-badge" id="cart-count">0</span>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>Crafted for Eternity</h1>
                <p>Minimalist wooden furniture to elevate your living space.</p>
                <!-- Functional Button Alert requirement mapped here -->
                <button id="cta-main-btn" class="btn">Shop Now</button>
            </div>
        </section>

        <section class="product-section">
            <div class="section-header">
                <h2>Featured Arrivals</h2>
            </div>
            <div class="product-grid">
                <div class="product-card">
                    <!-- Links to the individual Product Page -->
                    <a href="product.html">
                        <div class="product-img-wrap">
                            <img src="https://images.unsplash.com/photo-1503602642458-232111445657?auto=format&fit=crop&w=800&q=80" alt="Lounge Chair">
                        </div>
                        <div class="product-info">
                            <h4>Oak Lounge Chair</h4>
                            <p class="product-price">$349.00</p>
                        </div>
                    </a>
                    <button class="btn add-to-cart" style="margin-top:auto;">Add to Cart</button>
                </div>
                <div class="product-card">
                    <a href="product.html">
                        <div class="product-img-wrap">
                            <img src="https://images.unsplash.com/photo-1595515106969-1ce29566ff1c?auto=format&fit=crop&w=800&q=80" alt="Cabinet">
                        </div>
                        <div class="product-info">
                            <h4>Teak Storage Cabinet</h4>
                            <p class="product-price">$599.00</p>
                        </div>
                    </a>
                    <button class="btn add-to-cart" style="margin-top:auto;">Add to Cart</button>
                </div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
